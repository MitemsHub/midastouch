[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "midastouch"
version = "0.1.0"
description = "Gold-only algorithmic trading program on Deriv MT5 (XAUUSD)."
requires-python = ">=3.11"
authors = [{ name = "Emmanuel Mitti" }]
dependencies = []

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0.45"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
